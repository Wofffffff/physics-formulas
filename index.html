<script>
/* =========================================================
   ТЕОРИЯ (ПОЛНАЯ БАЗА ПО КУРСОВОЙ)
   ========================================================= */
const theoryBlocks = [
  {
    id: "criteria",
    title: "1.1 Критерии проверки (3 балла)",
    text: `
      <p class="theory-text"><b>3 балла:</b> Приведено полное правильное решение: верно записаны формулы, проведены математические преобразования, получен правильный числовой ответ с единицами измерения.</p>
      <p class="theory-text"><b>2 балла:</b> Решение содержит п.1, но допущена ошибка в математических преобразованиях ИЛИ не закончены вычисления.</p>
      <p class="theory-text"><b>1 балл:</b> Представлены только положения и формулы без преобразований ИЛИ отсутствует ОДНА из исходных формул.</p>
      <p class="theory-text"><b>0 баллов:</b> Все случаи, не соответствующие вышеуказанным критериям.</p>
    `
  },
  {
    id: "mistakes",
    title: "1.2 Типичные ошибки",
    text: `
      <ul class="theory-text">
        <li><b>Некорректное использование формул:</b> применение законов, не соответствующих частному случаю.</li>
        <li><b>Игнорирование единиц измерения:</b> расчёты без перевода величин в СИ.</li>
        <li><b>Математические ошибки:</b> арифметические просчёты, неправильное выражение искомой величины.</li>
        <li><b>Отсутствие промежуточных законов:</b> использование конечной формулы без записи исходных законов.</li>
      </ul>
    `
  },
  {
    id: "formulas_electro",
    title: "1.3 Электростатика",
    formulas: [
      { name: "Закон Кулона", latex: "F = k\\frac{|q_1||q_2|}{\\varepsilon r^2}", desc: "k = 9·10⁹ Н·м²/Кл²" },
      { name: "Напряжённость поля", latex: "E = \\frac{F}{q}", desc: "В/м" },
      { name: "Потенциал", latex: "\\varphi = \\frac{W}{q}", desc: "В" },
      { name: "Разность потенциалов (напряжение)", latex: "U = \\varphi_1 - \\varphi_2", desc: "Работа поля: A = qU" },
      { name: "Связь напряжения и напряжённости", latex: "U = Ed", desc: "Для однородного поля" },
      { name: "Электроёмкость", latex: "C = \\frac{q}{U}", desc: "Ф" },
      { name: "Ёмкость плоского конденсатора", latex: "C = \\frac{\\varepsilon \\varepsilon_0 S}{d}", desc: "ε₀ = 8,85·10⁻¹² Ф/м" },
      { name: "Энергия конденсатора", latex: "W = \\frac{qU}{2} = \\frac{CU^2}{2} = \\frac{q^2}{2C}", desc: "Дж" }
    ]
  },
  {
    id: "formulas_current",
    title: "1.4 Законы постоянного тока",
    formulas: [
      { name: "Сила тока", latex: "I = \\frac{\\Delta q}{\\Delta t}", desc: "А" },
      { name: "Закон Ома для участка цепи", latex: "I = \\frac{U}{R}", desc: "Ом" },
      { name: "Сопротивление проводника", latex: "R = \\rho\\frac{l}{S}", desc: "Удельное сопротивление ρ" },
      { name: "Закон Ома для полной цепи", latex: "I = \\frac{\\varepsilon}{R + r}", desc: "ЭДС и внутреннее сопротивление r" },
      { name: "Работа тока", latex: "A = IUt", desc: "Дж" },
      { name: "Закон Джоуля-Ленца", latex: "Q = I^2Rt", desc: "Дж" },
      { name: "Мощность тока", latex: "P = IU = I^2R = \\frac{U^2}{R}", desc: "Вт" }
    ]
  },
  {
    id: "formulas_magnetic",
    title: "1.5 Магнитное поле",
    formulas: [
      { name: "Сила Ампера", latex: "F_A = BIl\\sin\\alpha", desc: "α - угол между B и током I" },
      { name: "Сила Лоренца", latex: "F_L = |q|vB\\sin\\alpha", desc: "α - угол между B и скоростью v" },
      { name: "Радиус траектории заряда", latex: "R = \\frac{mv}{|q|B}", desc: "Движение по окружности" }
    ]
  },
  {
    id: "formulas_emi",
    title: "1.6 Электромагнитная индукция и колебания",
    formulas: [
      { name: "Магнитный поток", latex: "\\Phi = BS\\cos\\alpha", desc: "Вб" },
      { name: "Закон ЭМИ (Фарадея)", latex: "\\varepsilon = \\left|\\frac{\\Delta\\Phi}{\\Delta t}\\right|", desc: "В" },
      { name: "ЭДС в движущемся проводнике", latex: "\\varepsilon = Bvl\\sin\\alpha", desc: "α - угол между B и скоростью v" },
      { name: "Энергия магнитного поля", latex: "W = \\frac{LI^2}{2}", desc: "Дж" },
      { name: "Формула Томсона", latex: "T = 2\\pi\\sqrt{LC}", desc: "Период колебательного контура" }
    ]
  }
];

/* =========================================================
   ЗАДАЧИ №25 (ИЗ КУРСОВОЙ)
   ========================================================= */
const tasks25 = [
  {
    id: "method_1",
    title: "Динамический метод (проводник на наклонной плоскости)",
    condition: `На шероховатой плоскости, наклонённой под углом $\\alpha = 30^\\circ$ к горизонту, находится однородный цилиндрический проводник массой $m = 100$ г и длиной $l = 57{,}7$ см. По проводнику пропускают ток «от нас». Вся система находится в однородном магнитном поле с индукцией $B = 1$ Тл, направленной вертикально вниз. При каком токе цилиндр будет находиться в равновесии?`,
    image: "",
    solution: [
      `Нарисуем силы: силу тяжести $m\\vec{g}$, силу нормального давления $\\vec{N}$, силу Ампера $\\vec{F_A} = I B l$ (направлена горизонтально влево).`,
      `По второму закону Ньютона: $\\vec{N} + m\\vec{g} + \\vec{F_A} = 0$.`,
      `Спроецируем силы на направление вдоль плоскости: $F_A \\cos\\alpha - mg\\sin\\alpha = 0$.`,
      `Откуда: $I B l \\cos\\alpha = mg\\sin\\alpha$.`,
      `Выразим силу тока: $I = \\frac{mg}{B l} \\tan\\alpha$.`,
      `Подставим значения: $I = \\frac{0{,}1 \\cdot 10}{1 \\cdot 0{,}577} \\tan 30^\\circ \\approx 1$ А.`
    ],
    answer: "1 А"
  },
  {
    id: "method_2",
    title: "Алгоритмический метод (рамка в магнитном поле)",
    condition: `В плоской электрической цепи квадратной формы со стороной $a = 1$ м сопротивления резисторов равны $R_1 = 0{,}5$ Ом и $R_2 = 9{,}5$ Ом. Цепь помещают в однородное магнитное поле, перпендикулярное плоскости цепи, модуль которого возрастает по закону $B = kt$, где $k = 0{,}1$ Тл/с. Какая тепловая мощность будет выделяться в резисторе $R_1$?`,
    image: "",
    solution: [
      `При возрастании индукции увеличивается магнитный поток: $\\Delta\\Phi = \\Delta B \\cdot S = \\Delta B \\cdot a^2$.`,
      `По закону ЭМИ в контуре возникает ЭДС: $\\varepsilon = \\frac{\\Delta\\Phi}{\\Delta t} = k a^2$.`,
      `По закону Джоуля-Ленца тепловая мощность на $R_1$: $P = I^2 R_1$.`,
      `Сила тока в цепи: $I = \\frac{\\varepsilon}{R_1 + R_2}$.`,
      `Объединяя формулы: $P = \\left( \\frac{k a^2}{R_1 + R_2} \\right)^2 R_1$.`,
      `Подставляем: $P = \\left( \\frac{0{,}1 \\cdot 1^2}{0{,}5 + 9{,}5} \\right)^2 \\cdot 0{,}5 = (0{,}01)^2 \\cdot 0{,}5 = 0{,}00005$ Вт $= 50$ мкВт.`
    ],
    answer: "50 мкВт"
  }
];

/* =========================================================
   ГЕНЕРАТОРЫ ЗАДАЧ 11-15
   ========================================================= */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function round2(x) { return Math.round(x * 100) / 100; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const generators = [
  // ====== 11 ЗАДАНИЕ ======
  { id: 11, generate() {
      const q1 = randInt(2, 9); const q2 = randInt(2, 9); const r = randInt(1, 5);
      const F = (9 * q1 * q2) / (r * r); const correct = round2(F * 1000);
      const opts = [correct, round2(correct * 2), round2(correct / 2), round2(correct + 5)].sort(() => Math.random() - 0.5);
      return {
        condition: `Два точечных заряда $q_1 = ${q1}$ нКл и $q_2 = ${q2}$ нКл находятся на расстоянии $r = ${r}$ м друг от друга. Найдите силу их взаимодействия. Ответ дайте в мН.`,
        options: opts.map(o => `${o} мН`), correctIndex: opts.indexOf(correct),
        solution: [`Закон Кулона: $F = k\\frac{|q_1||q_2|}{r^2}$`, `$F = 9 \\cdot 10^9 \\cdot \\frac{${q1} \\cdot 10^{-9} \\cdot ${q2} \\cdot 10^{-9}}{${r}^2} = ${correct}$ мН.`],
        answer: `${correct} мН`
      };
    }
  },
  { id: 11, generate() {
      const U = randInt(10, 220); const P = randInt(2, 15) * 100; const I = round2(P / U);
      const opts = [I, round2(I * 2), round2(I / 2), round2(I + 1)].sort(() => Math.random() - 0.5);
      return {
        condition: `На корпусе электроприбора имеется надпись: «${U} В, ${P} Вт». Найдите силу тока, потребляемого прибором.`,
        options: opts.map(o => `${o} А`), correctIndex: opts.indexOf(I),
        solution: [`Мощность: $P = UI$.`, `$I = \\frac{P}{U} = \\frac{${P}}{${U}} \\approx ${I}$ А.`],
        answer: `${I} А`
      };
    }
  },
  { id: 11, generate() {
      const F1 = randInt(10, 40); const k1 = randInt(2, 4); const k2 = randInt(2, 4); const r = randInt(2, 4);
      const F2 = round2(F1 * k1 / k2 * (r * r));
      const opts = [F2, round2(F2 * 2), round2(F2 / 2), round2(F2 + 5)].sort(() => Math.random() - 0.5);
      return {
        condition: `Между двумя заряженными телами сила взаимодействия равна ${F1} мН. Если заряд одного тела увеличить в ${k1} раза, а заряд другого уменьшить в ${k2} раза, и расстояние уменьшить в ${r} раза, то какова будет сила?`,
        options: opts.map(o => `${o} мН`), correctIndex: opts.indexOf(F2),
        solution: [`$F = k\\frac{q_1 q_2}{r^2}$`, `$F' = k\\frac{${k1}q_1 \\cdot (q_2/${k2})}{(r/${r})^2} = \\frac{${k1}}{${k2}} \\cdot ${r*r} \\cdot F = ${F2}$ мН.`],
        answer: `${F2} мН`
      };
    }
  },
  { id: 11, generate() {
      const F = randInt(2, 20) / 10; const q = randInt(2, 20) / 10; const E = round2(F / q);
      const opts = [E, round2(E * 2), round2(E / 2), round2(E + 1)].sort(() => Math.random() - 0.5);

const app = document.getElementById("app");

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("phys_theme", theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
applyTheme(localStorage.getItem("phys_theme") || "light");

function renderLatex(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false }
      ],
      throwOnError: false
    });
  }
}

/* Генератор */
let currentGenTask = null;
let genAnswered = false;

function startGen(id) {
  const allForId = generators.filter(g => g.id === id);
  const gen = pick(allForId);
  
  currentGenTask = { ...gen.generate(), id: gen.id };
  genAnswered = false;

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderHome()">← На главную</button>
      <h2>Задание ${id}</h2>
    </div>

    <div class="task-card">
      <div class="task-condition">${currentGenTask.condition}</div>
      <div class="options" id="gen-options">
        ${currentGenTask.options.map((opt, i) => `
          <button onclick="checkGenTask(${i})" data-i="${i}">${opt}</button>
        `).join("")}
      </div>
      <div class="task-actions">
        <button class="primary" onclick="toggleSolution('gen-sol', this)">📖 Показать решение</button>
        <button onclick="startGen(${id})">🔄 Другая задача</button>
      </div>
      <div class="task-solution" id="gen-sol">
        ${currentGenTask.solution.map(step => `<div class="step">${step}</div>`).join("")}
        <div class="step" style="margin-top:16px; color:var(--green); font-weight:600;">Ответ: ${currentGenTask.answer}</div>
      </div>
    </div>
  `;
  renderLatex(app);
}

function checkGenTask(chosenIndex) {
  if (genAnswered) return;
  genAnswered = true;
  document.querySelectorAll("#gen-options button").forEach((b, i) => {
    if (i === currentGenTask.correctIndex) b.classList.add("correct");
    else if (i === chosenIndex) b.classList.add("wrong");
  });
  setTimeout(() => {
    const sol = document.getElementById("gen-sol");
    if (sol && !sol.classList.contains("open")) {
      sol.classList.add("open");
      document.querySelector(".task-actions button.primary").textContent = "📕 Скрыть решение";
      renderLatex(sol);
    }
  }, 500);
}

function toggleSolution(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  btn.textContent = el.classList.contains("open") ? "📕 Скрыть решение" : "📖 Показать решение";
  if (el.classList.contains("open")) renderLatex(el);
}

  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  btn.textContent = el.classList.contains("open") ? "❌ Скрыть ответ" : "✅ Показать ответ";
}
