<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формулы ЕГЭ по физике</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --text-soft: #9aa3b2;
    --border: #e0e4ec;
    --border-soft: #edf0f7;
    --border-dashed: #e0e4ec;
    --card-bg: #ffffff;
    --block-bg: #f8f9fc;
    --hover-bg: #f5f8ff;
    --accent: #4a6cf7;
    --accent-hover: #2d4fd6;
    --accent-soft: #f0f4ff;
    --accent-fade: #eef1f8;
    --green: #1e9e5a;
    --green-bg: #e3f7ec;
    --red: #d63b3b;
    --red-bg: #fde8e8;
    --purple: #8b5cf6;
    --shadow: rgba(74,108,247,0.08);
    --shadow-btn: rgba(74,108,247,0.3);
    --shadow-btn-hover: rgba(74,108,247,0.4);
  }

  html[data-theme="dark"] {
    --bg: #12141c;
    --text: #e8eaf0;
    --text-muted: #9aa3b2;
    --text-soft: #6b7280;
    --border: #2a2e3d;
    --border-soft: #232735;
    --border-dashed: #2a2e3d;
    --card-bg: #1a1d28;
    --block-bg: #232735;
    --hover-bg: #232735;
    --accent: #6b8aff;
    --accent-hover: #8aa3ff;
    --accent-soft: #1e2440;
    --accent-fade: #232735;
    --green: #34c27a;
    --green-bg: #1a3327;
    --red: #ef5a5a;
    --red-bg: #3a1f1f;
    --purple: #a78bfa;
    --shadow: rgba(107,138,255,0.1);
    --shadow-btn: rgba(107,138,255,0.35);
    --shadow-btn-hover: rgba(107,138,255,0.5);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
    transition: background .2s, color .2s;
  }
  .container { max-width: 900px; margin: 0 auto; }

  h1 { font-size: 28px; margin-bottom: 8px; text-align: center; }
  .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 15px; }

  .topbar {
    display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
    align-items: center;
  }
  .topbar input {
    flex: 1; min-width: 180px; padding: 12px 16px; font-size: 16px;
    border: 2px solid var(--border); border-radius: 12px; outline: none;
    background: var(--card-bg); color: var(--text);
  }
  .topbar input:focus { border-color: var(--accent); }
  .topbar button {
    padding: 12px 18px; font-size: 15px; border: 2px solid var(--border);
    background: var(--card-bg); color: var(--text);
    border-radius: 12px; cursor: pointer; transition: .15s;
    white-space: nowrap;
  }
  .topbar button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .topbar button.icon-btn { padding: 12px 14px; font-size: 18px; }

  /* Главный экран: две большие кнопки */
  .home-split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 600px) { .home-split { grid-template-columns: 1fr; } }

  .home-block {
    padding: 28px 24px; border-radius: 16px; cursor: pointer;
    border: 2px solid var(--border); background: var(--card-bg);
    text-align: center; transition: .2s;
  }
  .home-block:hover { transform: translateY(-3px); box-shadow: 0 8px 24px var(--shadow); }
  .home-block .icon { font-size: 42px; margin-bottom: 10px; }
  .home-block .title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .home-block .desc { font-size: 14px; color: var(--text-muted); }

  /* Сетки */
  .menu { display: grid; gap: 12px; }
  .menu button {
    padding: 18px 20px; font-size: 18px; background: var(--card-bg); color: var(--text);
    border: 2px solid var(--border); border-radius: 12px; cursor: pointer;
    text-align: left; transition: .15s; display: flex; justify-content: space-between;
    align-items: center; gap: 12px;
  }
  .menu button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .menu .count { color: var(--text-soft); font-size: 14px; text-align: right; }

  .section-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .section-header h2 { font-size: 24px; }
  .section-header .ege-info {
    font-size: 14px; color: var(--text-muted); background: var(--accent-soft);
    padding: 4px 12px; border-radius: 20px;
  }
  .back-btn {
    padding: 8px 16px; font-size: 15px; background: var(--card-bg); color: var(--text);
    border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
  }
  .back-btn:hover { border-color: var(--accent); }

  .subsection-title {
    font-size: 17px; font-weight: 600; color: var(--accent);
    margin: 28px 0 14px; padding-bottom: 8px;
    border-bottom: 2px solid var(--accent-fade);
  }
  .subsection-title:first-child { margin-top: 0; }

  .formula-card {
    background: var(--card-bg); border-radius: 14px; padding: 20px;
    margin-bottom: 14px; border: 2px solid var(--border-soft);
    transition: box-shadow .2s, background .2s;
  }
  .formula-card:hover { box-shadow: 0 4px 12px var(--shadow); }
  .formula-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .formula-body {
    font-size: 24px; text-align: center; padding: 16px 0;
    background: var(--block-bg); border-radius: 10px; margin-bottom: 12px;
    color: var(--text);
  }

  .formula-image {
    width: 100%; max-width: 480px; margin: 12px auto;
    display: block; border-radius: 10px;
    border: 2px solid var(--border-soft);
  }

  .toggle-btn {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--accent); font-weight: 600;
    padding: 6px 0; transition: .15s;
  }
  .toggle-btn:hover { color: var(--accent-hover); }
  .toggle-btn .arrow {
    display: inline-block; transition: transform .2s;
    font-size: 12px;
  }
  .toggle-btn.open .arrow { transform: rotate(90deg); }

  .symbols {
    font-size: 15px; color: var(--text);
    margin-top: 10px; padding-top: 12px;
    border-top: 1px dashed var(--border-dashed);
    display: none;
  }
  .symbols.open { display: block; }
  .symbols .sym-row { display: block; margin-bottom: 4px; }
  .symbols .sym-row .katex { display: inline; }
  .symbols b { color: var(--accent); font-weight: 600; }

  .note {
    margin-top: 10px; font-size: 13px; color: var(--text-muted);
    font-style: italic; border-left: 3px solid var(--border); padding-left: 12px;
  }
  .ege-badge {
    display: inline-block; margin-top: 10px;
    font-size: 13px; color: var(--text-muted); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 12px;
  }

  .ref-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .ref-tabs button {
    padding: 9px 14px; font-size: 14px; border: 2px solid var(--border);
    background: var(--card-bg); color: var(--text);
    border-radius: 20px; cursor: pointer; transition: .15s;
  }
  .ref-tabs button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .ref-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .ref-table {
    width: 100%; border-collapse: collapse;
    background: var(--card-bg); border-radius: 12px; overflow: hidden;
    border: 2px solid var(--border-soft);
  }
  .ref-table th, .ref-table td {
    padding: 12px 16px; text-align: left;
    border-bottom: 1px solid var(--accent-fade); font-size: 15px;
  }
  .ref-table th {
    background: var(--block-bg); font-weight: 600; font-size: 14px; color: var(--accent);
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .ref-table td:last-child { text-align: right; font-family: monospace; color: var(--text); }

  .flashcard {
    background: var(--card-bg); border-radius: 16px; padding: 48px 28px;
    text-align: center; border: 2px solid var(--border-soft); min-height: 280px;
    display: flex; flex-direction: column; justify-content: center; gap: 24px;
  }
  .flashcard .question { font-size: 16px; color: var(--text-muted); }
  .flashcard .content { font-size: 30px; }
  .flashcard .answer { font-size: 18px; line-height: 1.8; }
  .flashcard .answer .sym-list {
    font-size: 14px; color: var(--text);
    display: inline-block; margin-top: 10px; text-align: center;
  }
  .flashcard .answer .sym-list .sym-row {
    display: block; margin-bottom: 4px; text-align: center;
  }
  .flashcard .answer .sym-list .sym-row .katex { display: inline; }
  .flashcard .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .flashcard button {
    padding: 14px 26px; font-size: 16px; border: none; border-radius: 10px;
    cursor: pointer; background: var(--accent); color: #fff; transition: .15s;
  }
  .flashcard button.secondary { background: var(--accent-fade); color: var(--text); }
  .flashcard button:hover { opacity: .9; }

  .quiz-card {
    background: var(--card-bg); border-radius: 16px; padding: 28px;
    border: 2px solid var(--border-soft);
  }
  .quiz-question { font-size: 18px; margin-bottom: 20px; line-height: 1.7; }
  .quiz-options { display: grid; gap: 12px; }
  .quiz-options button {
    padding: 16px 20px; font-size: 18px; text-align: center;
    background: var(--block-bg); color: var(--text);
    border: 2px solid var(--border-soft); border-radius: 10px;
    cursor: pointer; transition: .15s;
  }
  .quiz-options button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .quiz-options button.correct { background: var(--green-bg); border-color: var(--green); }
  .quiz-options button.wrong { background: var(--red-bg); border-color: var(--red); }
  .quiz-result { margin-top: 16px; font-weight: 600; font-size: 17px; }
  .quiz-result.ok { color: var(--green); }
  .quiz-result.bad { color: var(--red); }

  /* Задачи ЕГЭ */
  .task-card {
    background: var(--card-bg); border-radius: 16px; padding: 28px;
    border: 2px solid var(--border-soft);
  }
  .task-condition {
    font-size: 17px; line-height: 1.8; margin-bottom: 20px;
  }
  .task-options { display: grid; gap: 12px; margin-bottom: 18px; }
  .task-options button {
    padding: 16px 20px; font-size: 17px; text-align: left;
    background: var(--block-bg); color: var(--text);
    border: 2px solid var(--border-soft); border-radius: 10px;
    cursor: pointer; transition: .15s;
  }
  .task-options button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .task-options button.correct { background: var(--green-bg); border-color: var(--green); }
  .task-options button.wrong { background: var(--red-bg); border-color: var(--red); }

  .task-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .task-actions button {
    padding: 12px 22px; font-size: 15px; border-radius: 10px;
    cursor: pointer; border: 2px solid var(--border);
    background: var(--card-bg); color: var(--text);
    transition: .15s;
  }
  .task-actions button:hover { border-color: var(--accent); background: var(--hover-bg); }
  .task-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .task-actions button.primary:hover { background: var(--accent-hover); }

  .task-solution {
    margin-top: 18px; padding: 18px 20px;
    background: var(--block-bg); border-radius: 12px;
    border-left: 4px solid var(--accent);
    display: none;
  }
  .task-solution.open { display: block; }
  .task-solution .step { margin-bottom: 12px; font-size: 15px; line-height: 1.7; }
  .task-solution .step-num {
    display: inline-block; width: 24px; height: 24px;
    background: var(--accent); color: #fff; border-radius: 50%;
    text-align: center; line-height: 24px; font-size: 13px; font-weight: 600;
    margin-right: 8px;
  }
  .task-answer {
    margin-top: 14px; padding: 14px 18px;
    background: var(--green-bg); border-radius: 12px;
    display: none; font-size: 16px;
  }
  .task-answer.open { display: block; }
  .task-answer b { color: var(--green); }

  .support {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
  }
  .support a {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px; background: var(--accent); color: #fff;
    border-radius: 50px; text-decoration: none; font-size: 15px;
    font-weight: 600; box-shadow: 0 4px 16px var(--shadow-btn);
    transition: .2s;
  }
  .support a:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow-btn-hover); }

  .empty { text-align: center; color: var(--text-soft); padding: 60px 0; font-size: 16px; }

  .katex { font-size: 1.1em; }

  @media print {
    body { background: #fff !important; color: #000 !important; padding: 0; }
    .topbar, .support, .toggle-btn, .task-actions,
    .back-btn, .section-header .ege-info, .ref-tabs { display: none !important; }

    .container { max-width: 100%; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; margin-bottom: 16px; }

    .formula-card, .task-card {
      border: 1px solid #ccc !important;
      box-shadow: none !important;
      page-break-inside: avoid;
      margin-bottom: 10px;
      padding: 12px;
    }
    .formula-body {
      background: #f5f5f5 !important;
      font-size: 18px;
      padding: 10px 0;
      margin-bottom: 8px;
    }
    .formula-title { font-size: 14px; }
    .symbols { display: block !important; font-size: 12px; }
    .task-solution, .task-answer { display: block !important; }

    .subsection-title {
      font-size: 14px; color: #000 !important;
      border-bottom: 1px solid #999;
      margin: 16px 0 8px;
      page-break-after: avoid;
    }
    .ege-badge { background: transparent !important; padding: 0; font-size: 11px; }
    .note { font-size: 11px; }
    .ref-table { font-size: 12px; }
    .ref-table th, .ref-table td { padding: 6px 10px; }
  }
</style>
</head>

/* =========================================================
   ЗАДАЧИ С АВТОПРОВЕРКОЙ (генерация чисел)
   ---------------------------------------------------------
   Каждая задача — объект с полями:
     id, topic, title, ege,
     generate() — возвращает { condition, options, correct, solution }
   ========================================================= */

// Утилиты для генерации чисел
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function round2(x) { return Math.round(x * 100) / 100; }

// Формирует 4 варианта: правильный + 3 отвлекающих
function makeOptions(correct, distractors) {
  const opts = [correct, ...distractors];
  const seen = new Set();
  const unique = [];
  for (const o of opts) {
    const key = String(o);
    if (!seen.has(key) && unique.length < 4) {
      seen.add(key);
      unique.push(o);
    }
  }
  // Если после удаления дубликатов не хватает — добиваем случайными
  while (unique.length < 4) {
    const filler = round2(correct * (0.5 + Math.random()));
    if (!seen.has(String(filler))) {
      seen.add(String(filler));
      unique.push(filler);
    }
  }
  // Перемешиваем
  const shuffled = [...unique].sort(() => Math.random() - 0.5);
  return { options: shuffled, correctIndex: shuffled.indexOf(correct) };
}

function openTopic(id) {
  const topic = topics.find(t => t.id === id);
  if (!topic) return;
  currentView = { type: "topic", id };

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderTheory()">← К теории</button>
      <h2>${topic.title}</h2>
      <span class="ege-info">ЕГЭ: ${topic.ege}</span>
    </div>
    <div id="cards"></div>
  `;
  const box = document.getElementById("cards");
  topic.subsections.forEach(sub => {
    const h = document.createElement("div");
    h.className = "subsection-title";
    h.textContent = sub.title;
    box.appendChild(h);
    sub.formulas.forEach(f => box.appendChild(makeFormulaCard(f)));
  });
  renderLatex(box);
}

function makeFormulaCard(f) {
  const card = document.createElement("div");
  card.className = "formula-card";
  const symId = "sym_" + f.id;

  card.innerHTML = `
    <div class="formula-title">${f.title}</div>
    <div class="formula-body">$$${f.latex}$$</div>
    ${f.image ? `<img src="${f.image}" alt="${f.title}" class="formula-image" onerror="this.style.display='none'">` : ""}
    <button class="toggle-btn" onclick="toggleSymbols('${symId}', this)">
      <span class="arrow">▶</span> Показать величины
    </button>
    <div class="symbols" id="${symId}">
      ${Object.entries(f.symbols).map(([k, v]) =>
        `<div class="sym-row"><b>$$${k}$$</b> - ${v}</div>`
      ).join("")}
    </div>
    ${f.note ? `<div class="note">${f.note}</div>` : ""}
    <div class="ege-badge">📍 ${f.ege}</div>
  `;
  return card;
}

function toggleSymbols(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  btn.classList.toggle("open");
  btn.querySelector(".arrow").textContent = el.classList.contains("open") ? "▼" : "▶";
  btn.childNodes[2].textContent = el.classList.contains("open") ? " Скрыть величины" : " Показать величины";
  renderLatex(el);
}

/* ========== ЗАДАЧИ ЕГЭ ========== */
let taskPool = [];
let taskIndex = 0;
let taskAnswered = false;

function startTasks() {
  currentView = { type: "tasks" };
  taskPool = [...tasks].sort(() => Math.random() - 0.5);
  taskIndex = 0;
  showTask();
}

function showTask() {
  if (taskPool.length === 0) { renderPractice(); return; }
  if (taskIndex >= taskPool.length) taskIndex = 0;

  const tpl = taskPool[taskIndex];
  currentTask = { ...tpl.generate(), template: tpl };
  taskAnswered = false;
  const solId = "task_sol";
  const ansId = "task_ans";

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderPractice()">← К практике</button>
      <h2>📝 Задача ${taskIndex + 1} из ${taskPool.length}</h2>
      <span class="ege-info">${currentTask.template.ege}</span>
    </div>
    <div class="task-card">
      <div class="task-condition">${currentTask.condition}</div>
      <div class="task-options" id="task-options">
        ${currentTask.options.map((opt, i) => `
          <button onclick="checkTask(${i})" data-i="${i}">${opt}</button>
        `).join("")}
      </div>
      <div class="task-actions">
        <button class="primary" onclick="toggleTaskSolution('${solId}', this)">📖 Показать решение</button>
        <button onclick="toggleTaskAnswer('${ansId}', this)">✅ Показать ответ</button>
        <button onclick="nextTask()">Другая задача →</button>
      </div>
      <div class="task-solution" id="${solId}">
        ${currentTask.solution.map((s, i) => `
          <div class="step"><span class="step-num">${i + 1}</span>${s}</div>
        `).join("")}
      </div>
      <div class="task-answer" id="${ansId}">
        <b>Ответ:</b> ${currentTask.answer}
      </div>
    </div>
  `;
  renderLatex(app);
}

function checkTask(chosenIndex) {
  if (taskAnswered) return;
  taskAnswered = true;
  document.querySelectorAll("#task-options button").forEach((b, i) => {
    if (i === currentTask.correctIndex) b.classList.add("correct");
    else if (i === chosenIndex) b.classList.add("wrong");
  });
  // Автоматически показываем решение после ответа
  setTimeout(() => {
    const sol = document.getElementById("task_sol");
    const ans = document.getElementById("task_ans");
    if (sol) { sol.classList.add("open"); renderLatex(sol); }
    if (ans) ans.classList.add("open");
  }, 400);
}

function toggleTaskSolution(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  btn.textContent = el.classList.contains("open") ? "📕 Скрыть решение" : "📖 Показать решение";
  if (el.classList.contains("open")) renderLatex(el);
}

function toggleTaskAnswer(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  btn.textContent = el.classList.contains("open") ? "❌ Скрыть ответ" : "✅ Показать ответ";
}

function nextTask() {
  taskIndex = (taskIndex + 1) % taskPool.length;
  if (taskIndex === 0) taskPool = [...tasks].sort(() => Math.random() - 0.5);
  showTask();
}

function renderRefTable(tab) {
  const renderTable = (rows) => `
    <table class="ref-table">
      <thead><tr><th>Величина</th><th>Значение</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.name}</td><td>${r.value} ${r.unit || ""}</td></tr>`).join("")}
      </tbody>
    </table>
  `;

  switch (tab) {
    case "constants":
      return `
        <table class="ref-table">
          <thead><tr><th>Название</th><th>Значение</th></tr></thead>
          <tbody>
            ${constants.map(c => `<tr><td>${c.name}</td><td>${c.value} ${c.unit || ""}</td></tr>`).join("")}
          </tbody>
        </table>
      `;
    case "prefixes":
      return `
        <table class="ref-table">
          <thead><tr><th>Приставка</th><th>Обозначение</th><th>Множитель</th><th>Число</th></tr></thead>
          <tbody>
            ${decimalPrefixes.map(p => `<tr><td>${p.name}</td><td>${p.symbol}</td><td>${p.power}</td><td>${p.value}</td></tr>`).join("")}
          </tbody>
        </table>
      `;
    case "units": return renderTable(unitConversions);
    case "particles": return renderTable(particleMasses);
    case "densities": return renderTable(densities);
    case "heat": return renderTable(heatCapacities);
    case "latent": return renderTable(latentHeats);
    case "normal": return renderTable(normalConditions);
    case "molar": return renderTable(molarMasses);
    default: return "";
  }
}

/* ========== ПОИСК ========== */
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { renderHome(); return; }
  currentView = { type: "search" };

  const found = allFormulas.filter(f =>
    f.title.toLowerCase().includes(q) ||
    f.latex.toLowerCase().includes(q) ||
    Object.keys(f.symbols).some(k => k.toLowerCase().includes(q)) ||
    Object.values(f.symbols).some(v => v.toLowerCase().includes(q))
  );

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="searchInput.value=''; renderHome();">← На главную</button>
      <h2>Поиск: «${q}»</h2>
    </div>
    <div id="cards"></div>
  `;
  const box = document.getElementById("cards");
  if (found.length === 0) {
    box.innerHTML = `<div class="empty">Ничего не найдено.</div>`;
    return;
  }
  found.forEach(f => box.appendChild(makeFormulaCard(f)));
  renderLatex(box);
});

let flashDeck = [], flashIndex = 0, flashRevealed = false;

function startFlashcards() {
  currentView = { type: "flash" };
  flashDeck = [...allFormulas].sort(() => Math.random() - 0.5);
  flashIndex = 0;
  flashRevealed = false;
  renderFlashcard();
}
function renderFlashcard() {
  if (flashDeck.length === 0) { renderPractice(); return; }
  const f = flashDeck[flashIndex];
  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderPractice()">← К практике</button>
      <h2>🧠 Флеш-карты (${flashIndex + 1} / ${flashDeck.length})</h2>
    </div>
    <div class="flashcard">
      <div class="question">Что означает эта формула?</div>
      <div class="content">$$${f.latex}$$</div>
      ${flashRevealed ? `
        <div class="answer">
          <b>${f.title}</b>
          <div class="sym-list">
            ${Object.entries(f.symbols).map(([k, v]) =>
              `<div class="sym-row"><b>$$${k}$$</b> - ${v}</div>`
            ).join("")}
          </div>
          <div style="font-size:13px;color:var(--text-soft);margin-top:8px;">📍 ${f.ege}</div>
        </div>
      ` : ""}
      <div class="buttons">
        ${flashRevealed
          ? `<button class="secondary" onclick="flashPrev()">← Назад</button>
             <button onclick="flashNext()">Дальше →</button>`
          : `<button onclick="flashReveal()">Показать ответ</button>`}
      </div>
    </div>
  `;
  renderLatex(app);
}
function flashReveal() { flashRevealed = true; renderFlashcard(); }
function flashNext() { flashIndex = (flashIndex + 1) % flashDeck.length; flashRevealed = false; renderFlashcard(); }
function flashPrev() { flashIndex = (flashIndex - 1 + flashDeck.length) % flashDeck.length; flashRevealed = false; renderFlashcard(); }

/* ========== ТРЕНАЖЁРЫ ========== */
let quizCorrect = null, quizAnswered = false, reverseQuizCorrect = null, reverseQuizAnswered = false;

function startQuiz() {
  currentView = { type: "quiz" };
  quizCorrect = allFormulas[Math.floor(Math.random() * allFormulas.length)];
  const others = allFormulas.filter(f => f.id !== quizCorrect.id).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [quizCorrect, ...others].sort(() => Math.random() - 0.5);
  quizAnswered = false;

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderPractice()">← К практике</button>
      <h2>🎯 Выбери формулу</h2>
    </div>
    <div class="quiz-card">
      <div class="quiz-question">Какая формула соответствует названию:<br><b>«${quizCorrect.title}»</b>?</div>
      <div class="quiz-options" id="quiz-options">
        ${options.map(f => `
          <button onclick="answerQuiz('${f.id}')" data-id="${f.id}">$$${f.latex}$$</button>
        `).join("")}
      </div>
      <div class="quiz-result" id="quiz-result"></div>
      <div style="margin-top:20px;"><button class="back-btn" onclick="startQuiz()">Другая задача →</button></div>
    </div>
  `;
  renderLatex(app);
}
function answerQuiz(id) {
  if (quizAnswered) return;
  quizAnswered = true;
  document.querySelectorAll("#quiz-options button").forEach(b => {
    if (b.dataset.id === quizCorrect.id) b.classList.add("correct");
    else if (b.dataset.id === id) b.classList.add("wrong");
  });
  const r = document.getElementById("quiz-result");
  if (id === quizCorrect.id) { r.className = "quiz-result ok"; r.textContent = "✅ Верно!"; }
  else { r.className = "quiz-result bad"; r.textContent = "❌ Неверно. Правильный вариант выделен зелёным."; }
}

function startReverseQuiz() {
  currentView = { type: "reverseQuiz" };
  reverseQuizCorrect = allFormulas[Math.floor(Math.random() * allFormulas.length)];
  const others = allFormulas.filter(f => f.id !== reverseQuizCorrect.id).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [reverseQuizCorrect, ...others].sort(() => Math.random() - 0.5);
  reverseQuizAnswered = false;

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderPractice()">← К практике</button>
      <h2>🔄 Выбери название</h2>
    </div>
    <div class="quiz-card">
      <div class="quiz-question" style="text-align:center; font-size:28px;">$$${reverseQuizCorrect.latex}$$</div>
      <div class="quiz-options" id="quiz-options">
        ${options.map(f => `
          <button onclick="answerReverseQuiz('${f.id}')" data-id="${f.id}">${f.title}</button>
        `).join("")}
      </div>
      <div class="quiz-result" id="quiz-result"></div>
      <div style="margin-top:20px;"><button class="back-btn" onclick="startReverseQuiz()">Другая задача →</button></div>
    </div>
  `;
  renderLatex(app);
}
function answerReverseQuiz(id) {
  if (reverseQuizAnswered) return;
  reverseQuizAnswered = true;
  document.querySelectorAll("#quiz-options button").forEach(b => {
    if (b.dataset.id === reverseQuizCorrect.id) b.classList.add("correct");
    else if (b.dataset.id === id) b.classList.add("wrong");
  });
  const r = document.getElementById("quiz-result");
  if (id === reverseQuizCorrect.id) { r.className = "quiz-result ok"; r.textContent = "✅ Верно!"; }
  else { r.className = "quiz-result bad"; r.textContent = "❌ Неверно. Правильный вариант выделен зелёным."; }
}

renderHome();
</script>
